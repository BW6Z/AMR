function portrait(n){const variant=[1,2,3,0,2,1,0,2][n];const colors=['#536d59','#586f70','#775e53','#857b52','#567969','#7b744e','#695d79','#6a7787'],hat=variant===1?'<path d="M53 69L47 41L73 45L88 15L104 44L133 40L124 69Z" fill="#bba46a"/><path d="M49 67H130" stroke="#e7d1a0" stroke-width="4"/>':variant===2?'<path d="M53 65Q49 24 88 28Q130 24 126 65Z" fill="#c8b991"/><path d="M60 45L121 47" stroke="#827e58" stroke-width="5"/>':variant===3?'<path d="M45 69Q54 4 91 17Q125 20 139 71L111 61L69 63Z" fill="#5e6b49"/><path d="M91 20L110 60" stroke="#a3a36b"/>':'<path d="M56 67Q57 28 93 29Q127 34 126 73L109 56L78 57L60 81Z" fill="#574c37"/>';
return '<svg viewBox="0 0 180 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><pattern id="stars'+n+'" width="29" height="34" patternUnits="userSpaceOnUse"><path d="M14 4V10M11 7H17" stroke="#d9c28a" opacity=".26"/></pattern></defs><rect width="180" height="210" fill="'+colors[n]+'"/><rect width="180" height="210" fill="url(#stars'+n+')"/><circle cx="90" cy="82" r="59" fill="none" stroke="#d3b976" opacity=".5"/><circle cx="90" cy="82" r="51" fill="#d1bd82" opacity=".15"/><path d="M25 210L35 151Q44 127 71 121L106 121Q144 129 150 159L163 210Z" fill="'+(['#b6a77d','#293f35','#d3ccb0','#3c4b36'][variant])+'" stroke="#263e31" stroke-width="2"/><path d="M71 112L69 133L90 147L110 130L106 110Z" fill="#bb986f"/><path d="M60 64Q58 41 88 40Q121 42 121 72L116 99Q106 124 89 124Q67 120 61 94Z" fill="#d5b88b" stroke="#66583d" stroke-width="1.5"/>'+hat+'<path d="M69 82L79 81M100 81L111 82" stroke="#554f38" stroke-width="2"/><path d="M89 84L85 99L94 100M81 108Q90 111 99 107" fill="none" stroke="#967b54" stroke-width="1.5"/>'+(variant===2?'<g fill="none" stroke="#665b3b" stroke-width="2"><circle cx="75" cy="84" r="11"/><circle cx="105" cy="84" r="11"/><path d="M86 82H94"/></g>':'')+'<path d="M71 129L89 149L107 128M89 149V207" fill="none" stroke="#d4c493" stroke-width="2"/><path d="M43 172Q61 161 73 177L92 183L87 199L55 193Z" fill="#c9ac7d" stroke="#6c6545"/>'+(variant===3?'<path d="M112 137V158L101 181Q98 194 113 196H132Q145 192 138 179L126 158V137Z" fill="#9fa978" stroke="#d1c28e" stroke-width="2"/><path d="M105 176H136L140 187Q140 194 131 194H112Q100 193 104 182Z" fill="#d6bd76"/><path d="M110 137H128" stroke="#dfcca0" stroke-width="4"/>':variant===2?'<path d="M105 151L139 159L127 201L96 193Z" fill="#d5c89f" stroke="#706844"/><path d="M110 163L129 169M108 173L126 179M105 183L119 187" stroke="#8e8761"/>':variant===1?'<path d="M128 118V208" stroke="#b99e5e" stroke-width="5"/><circle cx="128" cy="117" r="8" fill="#b99e5e"/><path d="M120 158Q140 148 138 166L129 181L119 176Z" fill="#d1b181"/>':'<path d="M113 162Q107 145 114 137Q119 153 116 163M115 170Q128 147 137 148Q132 164 115 170" fill="#6d804e" stroke="#304e35"/><path d="M115 157V191" stroke="#4e6741" stroke-width="3"/>')+'<path d="M6 201H174" stroke="#d3bb7e" opacity=".5"/><circle cx="153" cy="184" r="15" fill="#e5d7ae" stroke="#88754d"/><text x="153" y="189" text-anchor="middle" font-size="14" fill="#425640">'+['+','?','A','*','X','O','3','N'][n]+'</text></svg>';}
function card(n){return '<div class="tarot"><div class="roman">'+roman[n]+' · THE COUNCIL</div><div class="portrait">'+portrait(n)+'</div><h3>'+roleNames[n]+'</h3><div class="subtitle">'+roleLibrary[n].title+'</div></div>';}
function cardBack(){return '<div class="tarot card-back"><div class="roman">EIGHT POSSIBLE IDENTITIES</div><div class="back-seal">✧</div><h3>Role unknown</h3><div class="subtitle">Drawn when the round begins</div></div>';}
function header(){return '<header><div class="brand"><div class="seal">✧</div><div><strong>Body Council</strong><small>BODY COUNCIL</small></div></div><div class="header-right"><span class="desktop-only">Four perspectives. One shared decision.</span><button class="text-btn" data-do="rules">How to play ↗</button>'+(session?'<button class="text-btn" data-do="leave">Leave</button>':'')+'</div></header>';}
const footer=()=>'<footer><span>BODY COUNCIL &nbsp; / &nbsp; Original cooperative card game · Prototype 01</span><span>Fictional cases and simplified mechanics for learning, not medical guidance.</span></footer>';
function landing(){return header()+'<main class="wrap"><section class="intro"><div class="intro-copy"><div class="eyebrow">A COOPERATIVE CARD GAME</div><h1>You only hold<br><em>part of the story.</em></h1><p>Eight roles. Four drawn fresh each round.<br>As the body changes, share what you know,<br>weigh your options, and decide together.</p><div class="tags"><span>4 players</span><span>3 rounds</span><span>~15 minutes</span></div></div><div class="hero-cards"><div class="halo"></div>'+card(2)+card(0)+card(3)+'<div class="hero-label">Every perspective changes the story.</div></div></section><section class="join-panel"><div class="join-title"><h2>Take your seat at the Council</h2><small>Play on desktop or mobile</small></div><div class="join-row"><label>Your name<input id="nickname" maxlength="16" placeholder="What should your partners call you?" value="'+esc(nick)+'" autocomplete="nickname"></label><button class="btn" data-do="match">Find players ↗</button><button class="btn outline" data-do="create">Create a room</button></div><div class="join-secondary"><button class="text-btn" data-do="demo">Try a practice game →</button><div class="code-join"><input id="joincode" aria-label="6-letter room code" maxlength="6" placeholder="6-letter room code" value="'+esc(joinCode)+'"><button data-do="join">Join room →</button></div></div></section><section class="steps"><div class="step"><span class="num">01</span><div><h3>Draw a new role</h3><p>Four unique roles are drawn from a deck of eight.<br>Discover a new perspective every round.</p></div></div><div class="step"><span class="num">02</span><div><h3>Connect the clues</h3><p>Read your private cards. Ask questions.<br>Separate evidence from assumptions.</p></div></div><div class="step"><span class="num">03</span><div><h3>Share the consequences</h3><p>Shared basic actions. One personal power.<br>Propose, vote, and see the body change.</p></div></div></section></main>'+footer();}
function lobby(){return header()+'<main class="wrap"><section class="lobby"><div class="smallcaps">THE COUNCIL IS GATHERING</div><h1>A seat awaits you.</h1><p>Room code <button class="text-btn" style="color:#dfc486;letter-spacing:.15em" data-do="copy">'+esc(session.code)+' ⧉</button> · '+state.players.length+' / 4 seated</p><div class="seat-grid">'+Array.from({length:4},(_,i)=>{let p=state.players[i];return '<div class="seat">'+(p?cardBack():'<div class="empty-seat"><strong>✧</strong><span>Awaiting a partner</span></div>')+'<div class="person">'+(p?esc(p.name)+(p.name===state.me.name?' · You':''):'Share the code to invite a partner')+'</div></div>';}).join('')+'</div><div class="lobby-actions"><button class="btn outline" data-do="copy">Copy invitation link</button><button class="btn outline" data-do="deck">Explore all 8 roles</button>'+(state.me.host?'<button class="btn" data-do="start" '+(state.players.length<4?'disabled':'')+'>Begin the Council →</button>':'<span class="pill">Waiting for the host</span>')+'</div><p class="lobby-note">Four secret roles are drawn from eight when each round begins. Only your own identity is visible until the round ends. Every player can use the basic actions. Your special power changes with your role. Rooms expire two hours after the last action.</p></section></main>'+footer();}
function bodyArt(){return '<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="120" cy="144" r="109" fill="none" stroke="#af9c66" opacity=".28"/><circle cx="120" cy="144" r="96" fill="none" stroke="#af9c66" opacity=".18" stroke-dasharray="3 8"/><path d="M108 65Q88 49 98 26Q104 11 120 12Q145 12 145 39Q145 55 131 65L133 80L162 88Q172 91 177 110L199 177Q202 189 191 193Q182 195 178 183L159 137L152 159L159 201L152 282Q150 294 139 292L130 290L123 212H117L110 289L99 292Q88 293 87 280L82 204L88 158L82 137L65 182Q59 194 49 188Q42 184 46 174L66 111Q70 93 81 88L107 80Z" fill="#c5b17c22" stroke="#c9b783" stroke-width="1.5"/><path d="M118 75V195M118 109L90 99M118 109L149 99M118 147L93 165M118 147L146 165M118 195L101 268M118 195L142 268" fill="none" stroke="#cfad76" opacity=".5" stroke-width="2"/><path d="M106 112Q95 91 86 111Q78 138 104 137M129 112Q139 90 149 112Q157 138 132 138" fill="#b99b692b" stroke="#b9a26b" opacity=".65"/><path d="M114 131Q108 117 119 116Q132 115 133 128L120 143Z" fill="#bca678"/><g fill="#cebb7a" stroke="#e4cf89" stroke-width=".7"><ellipse cx="102" cy="164" rx="9" ry="4" transform="rotate(-28 102 164)"/><ellipse cx="137" cy="180" rx="9" ry="4" transform="rotate(30 137 180)"/><ellipse cx="115" cy="185" rx="7" ry="3" transform="rotate(-43 115 185)"/></g><g fill="#8da57c"><circle cx="92" cy="184" r="3"/><circle cx="142" cy="153" r="3"/><circle cx="127" cy="163" r="3"/><circle cx="130" cy="197" r="2"/></g></svg>';}
function actionDisabled(a){return (a==='test'&&(state.tested||state.pending))||(a==='rush'&&state.tested)||(a==='review'&&!state.tested);}
function game(){const role=state.me.role;return header()+'<main class="play-wrap"><div class="status-line"><div class="rounds">'+[1,2,3].map(i=>'<span class="round-dot '+(i===state.round?'active':'')+'">'+roman[i-1]+'</span>').join('')+'<span class="round-name">'+['','First signs','Gathering evidence','Review & decide'][state.round]+'</span></div><button class="text-btn pill" data-do="copy">Room '+esc(session.code)+' ⧉</button></div>'+(state.mode==='demo'?'<div class="notice">Practice mode · Three scripted partners share clues and support proposals. They do not activate their powers automatically. Your own power changes each round.</div>':'')+roundRoster()+'<nav class="mobile-tabs" aria-label="Game panels">'+[['hand','Your hand'],['board','Shared table'],['chat','Council messages']].map(([v,t])=>'<button data-tab="'+v+'" class="'+(tab===v?'active':'')+'">'+t+'</button>').join('')+'</nav><div class="game-grid"><aside data-pane="hand" class="'+(tab==='hand'?'visible':'')+'"><div class="section-label">YOUR HAND <b>Only you can see this</b></div><div class="role-summary"><div class="role-avatar">'+portrait(roleNames.indexOf(role.name))+'</div><div><small>'+esc(state.me.name)+'</small><h2>'+esc(role.name)+'</h2><p>'+esc(role.ability)+'</p></div></div>'+powerCard() +state.cards.map((c,i)=>'<article class="info-card"><h3>'+esc(c.label)+'</h3><p>'+esc(c.text)+'</p><button class="share-btn" data-share="'+i+'">Share this clue ↗</button></article>').join('')+'</aside><section data-pane="board" class="'+(tab==='board'?'visible':'')+'"><div class="section-label">THE SHARED BODY <b>Shared with everyone</b></div><div class="board"><div class="board-head"><span>Body condition · Round '+state.round+'</span><span>✧ PUBLIC KNOWLEDGE</span></div><div class="body-art">'+bodyArt()+'</div><div class="health"><span class="smallcaps">HEALTH</span><strong>'+state.health+' <small>/ 10</small></strong><div class="meter"><i style="width:'+state.health*10+'%"></i></div><p>'+esc(state.symptom)+'<br>Symptoms alone do not establish a cause</p></div><div class="board-seal"><strong>'+state.round+'</strong><span>ROUND / III</span></div><div class="board-foot"><span>Cause · Discuss the evidence</span><span>Normal flora · Needs follow-up</span><span>Test · '+(state.tested?'Result delivered privately':state.pending?'Pending':'Not requested')+'</span></div></div><div class="planning"><h2>What shall we do next?</h2><p>Every player can propose basic actions. Choose two, or up to three with Extra supply. Three votes in favor execute the plan; two against reopen discussion.</p>'+plan()+'</div>'+history()+'</section><aside data-pane="chat" class="chat-column '+(tab==='chat'?'visible':'')+'">'+chat()+'</aside></div></main>';}
function plan(){if(state.proposal){const p=state.proposal;return '<div class="proposal-box"><div class="smallcaps">'+esc(p.by)+' proposes</div><p style="margin:10px 0"><strong>'+p.actions.map(a=>names[a]).join(' ＋ ')+'</strong></p><div class="vote-count"><span>in favor '+p.yes+' / 3</span><span>against '+p.no+' / 2</span></div>'+(p.myVote===null?'<div class="vote-actions"><button class="btn" data-do="yes">Support plan</button><button class="btn outline" data-do="no">Oppose & discuss</button></div>':'<p>You voted '+(p.myVote?'in favor':'against')+'. Waiting for your partners.</p>')+'</div>';}
const icons={test:'⌕',rush:'◷',A:'⚱',B:'⚱',care:'❧',review:'▤'},desc={test:'Result next round',rush:'Pair with a new test',A:'Matches bacterium X',B:'Matches bacterium Y',care:'Prevent 1 health loss',review:'Read hidden state'};
return '<div class="action-grid">'+Object.keys(names).map(a=>'<button class="action-card '+(selected.includes(a)?'selected':'')+'" data-action="'+a+'" aria-pressed="'+selected.includes(a)+'" '+(actionDisabled(a)?'disabled':'')+'><span class="icon">'+icons[a]+'</span><strong>'+names[a]+'</strong><small>'+desc[a]+'</small></button>').join('')+'</div><div class="proposal-footer"><span>Allocated '+selected.length+' / '+state.budget+' action points</span><button class="btn" data-do="propose" '+(selected.length<2||selected.length>state.budget?'disabled':'')+'>Propose plan →</button></div>';}
function history(){if(!state.history.length)return '';return '<div class="history"><div class="section-label">PREVIOUS DECISIONS <b>Completed rounds · roles revealed</b></div>'+state.history.map(h=>{const draw=state.draws.find(d=>d.round===h.round);return '<p>Round '+h.round+' · '+h.actions.map(a=>names[a]).join(' ＋ ')+' · Health '+h.before.health+' → '+h.after.health+'</p>'+(draw?'<p class="revealed-roles">'+draw.seats.map(p=>esc(p.name)+' — '+esc(roleLibrary.find(r=>r.id===p.role)?.name||p.role)).join(' · ')+'</p>':'');}).join('')+'</div>';}
function chat(){return '<div class="section-label">THE CONVERSATION <b>Exchange your clues</b></div><section class="council"><div class="council-title"><h2>Council messages</h2><small>4 SEATS</small></div><div class="players">'+state.players.map(p=>'<div class="player"><i class="dot"></i><span>'+esc(p.name)+' · '+esc(p.role.name)+(p.bot?' / scripted':'')+'</span></div>').join('')+'</div><div class="messages" id="messages" aria-label="Council message history">'+state.chat.map(m=>'<div class="message '+(m.who==='Council'?'system':'')+'"><small>'+esc(m.who)+' · Round '+m.round+'</small><p>'+esc(m.text)+'</p></div>').join('')+'</div><form class="chat-form" id="chat-form"><textarea id="chat-draft" aria-label="Message the Council" maxlength="350" placeholder="What do you know? What still needs confirming?">'+esc(chatDraft)+'</textarea><div class="chat-bottom"><small>Enter to send · Shift + Enter for a new line</small><button class="btn" type="submit">Send ↗</button></div></form></section>';}
function end(){const r=state.reveal;return header()+'<main class="wrap"><section class="end"><div class="smallcaps">THE STORY BEHIND YOUR DECISIONS</div><h1>Bring every clue to the table.</h1><p class="lede">The cause was fictional bacterium '+r.pathogen+', matched by remedy '+(r.pathogen==='X'?'A':'B')+'.<br>The full body state is now revealed. See how your choices changed it.</p><div class="reveal-grid"><div class="reveal-stat"><small>Health · Started at 6</small><strong>'+state.health+'</strong><small>Higher is better / 10</small></div><div class="reveal-stat"><small>Bacteria · Started at 3</small><strong>'+r.load+'</strong><small>Units remaining</small></div><div class="reveal-stat"><small>Flora · Started at 5</small><strong>'+r.flora+'</strong><small>Units remaining</small></div></div><table><thead><tr><th>Round & decision</th><th>Health</th><th>Bacteria</th><th>Normal flora</th></tr></thead><tbody>'+state.history.map(h=>'<tr><td>Round '+h.round+'<br>'+h.actions.map(a=>names[a]).join(' ＋ ')+'</td><td>'+h.before.health+' → '+h.after.health+'</td><td>'+h.before.load+' → '+h.after.load+'</td><td>'+h.before.flora+' → '+h.after.flora+'</td></tr>').join('')+'</tbody></table><div class="debrief"><h2>How did you reach your decisions?</h2><p>✧ Which clue from a partner changed your mind?<br>✧ Did better symptoms make you assume the problem was resolved?<br>✧ Who would you ask earlier, and what would you ask?<br>✧ What further review or follow-up would you plan?</p></div><div class="notice" style="margin-top:20px">Three rounds ending does not mean treatment ends. Fictional causes and simplified remedy and flora mechanics are not medical or treatment-duration advice.</div><button class="btn" data-do="leave">Return to the hall →</button><div style="margin-top:30px">'+chat()+'</div></section></main>'+footer();}
function render(){const focused=document.activeElement;let id=focused?.id,start=focused?.selectionStart,endPos=focused?.selectionEnd;const msg=$('#messages'),atBottom=!msg||msg.scrollHeight-msg.scrollTop-msg.clientHeight<50,oldScroll=msg?.scrollTop;$('#app').innerHTML=state?(state.phase==='lobby'?lobby():state.phase==='end'?end():game()):landing();const next=$('#messages');if(next)next.scrollTop=atBottom?next.scrollHeight:oldScroll;if(id&&$('#'+id)){const el=$('#'+id);el.focus({preventScroll:true});try{el.setSelectionRange(start,endPos);}catch{}}}
let toastTimer;function toast(t){$('#toast').className='toast';$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('#toast').className='';$('#toast').textContent='';},4500);}
async function request(body){const n=++seq;const res=await fetch('/api'+(!body?'?code='+encodeURIComponent(session.code):''),{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),...(session?{Authorization:'Bearer '+session.token}:{})},body:body?JSON.stringify({...body,code:session?.code||body.code,round:state?.round}):undefined});let data;try{data=await res.json();}catch{throw Error('Cannot connect to the game service. Please try again.');}if(!res.ok)throw Error(data.error||'Request failed.');if(n!==seq)return null;return data;}
function accept(s){if(!s)return;if(state?.round!==s.round||state?.proposal?.id!==s.proposal?.id)selected=[];const sig=JSON.stringify(s);state=s;selected=selected.filter(a=>!actionDisabled(a));if(sig!==signature){signature=sig;render();}}
async function action(op){if(busy)return;busy=true;try{if(['create','join','match','demo'].includes(op)){nick=$('#nickname')?.value.trim()||nick;if(!nick){toast('Choose a name first.');$('#nickname')?.focus();return;}joinCode=$('#joincode')?.value.trim().toUpperCase()||joinCode;if(op==='join'&&!/^[A-Z2-9]{6}$/.test(joinCode)){toast('Enter the full six-letter room code.');return;}const d=await request({op,name:nick,code:joinCode});if(!d)return;session={code:d.code,token:d.token};try{localStorage.setItem('body-council-session',JSON.stringify(session));localStorage.setItem('body-council-name',nick);}catch{}accept(d.state);return;}
const body={op};if(op==='propose')body.actions=selected;if(op==='yes'||op==='no'){body.op='vote';body.yes=op==='yes';body.proposalId=state.proposal.id;}accept(await request(body));}catch(e){toast(e.message);}finally{busy=false;}}
async function send(){if(busy||!chatDraft.trim())return;busy=true;try{const s=await request({op:'chat',text:chatDraft});chatDraft='';accept(s);if($('#chat-draft'))$('#chat-draft').value='';}catch(e){toast(e.message);}finally{busy=false;}}
function openModal(title,content){$('#overlay').innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rules-title"><div class="modal-content"><div class="smallcaps" style="color:#837044">BODY COUNCIL · EIGHT-ROLE EDITION</div><h2 id="rules-title">'+title+'</h2>'+content+'<button class="btn" data-do="close-rules">Back to the table</button></div></div>';$('#overlay button').focus({preventScroll:true});$('#overlay .modal-content').scrollTop=0;}
function rules(){openModal('A new perspective, every round.','<h3>Eight roles. Four drawn each round.</h3><p>At the start of every round, shuffle all eight roles and deal four different roles, one to each seat. Roles may reappear in later rounds. Only your own role is visible during the round. Other seats display Hidden role. All four identities are revealed after resolution. The patient is the shared body on the table. Player names, body state, messages, and evidence persist.</p><h3>Basic actions belong to everyone</h3><p>Any player can propose a diagnostic test, expedite, remedy A or B, care, or a follow-up. No role is required. A test or follow-up goes privately to the proposing player, even if that player changes role. A matches X; B matches Y.</p><h3>One free power per round</h3><p>Read your role power in Your hand. Activate it once, before a proposal is being voted on. Powers cost no basic action points. Private discoveries go only to the activating player. Chat signatures and power announcements do not name your role. Shared effects may give partners clues, and you may choose to reveal your identity in discussion. Unused powers expire when roles are redrawn.</p><h3>Shared decisions</h3><p>Normally choose two different actions. Extra supply permits a third action this round; using only two is still allowed. Three votes in favor execute a plan, and two against reopen discussion. The proposer supports automatically. No powers can change the plan while voting is in progress.</p><h3>Memory survives a role change</h3><p>Your evidence notebook stays with you. Basic diagnostic samples record the moment of sampling, and return next round unless expedited. Anyone can share evidence through Council messages. Every round draws from the full eight-role deck again.</p><h3>Play together or practice</h3><p>Four human seats are needed for a multiplayer room. Practice adds three scripted partners that share clues and support your plans, but do not activate powers automatically. They are not AI players.</p><p style="margin-top:18px">Fictional cases and simplified powers support learning discussions, not real medical or treatment advice.</p>');}
function showDeck(){openModal('The eight-role deck.','<p>Each round draws four unique roles from this full deck. Basic actions are available to every seat.</p><div class="role-deck">'+roleLibrary.map((r,i)=>'<article class="deck-entry"><div class="deck-art">'+portrait(i)+'</div><h3>'+esc(r.name)+'</h3><strong>'+esc(r.power.name)+'</strong><p>'+esc(r.power.description)+'</p></article>').join('')+'</div>');}
function powerCard(){const r=state.me.role;return '<article class="info-card power-card"><div class="smallcaps">ROUND '+state.round+' · FREE SPECIAL POWER</div><h3>'+esc(r.power.name)+'</h3><p>'+esc(r.power.description)+'</p><button class="btn" data-do="power" '+(state.me.powerUsed||state.proposal?'disabled':'')+'>'+(state.me.powerUsed?'Used this round':'Use '+esc(r.power.name))+'</button><small>'+ (state.proposal?'Resolve the current vote before using a power.':'Once this round · No action point cost')+'</small></article>';}
function roundRoster(){return '<section class="round-roster"><div><span class="smallcaps">THIS ROUND · ROLES HIDDEN</span><button class="text-btn" data-do="deck">Explore the deck ↗</button></div><div class="role-chips">'+state.players.map(p=>'<span>'+esc(p.name)+' <b>'+esc(p.role.name)+'</b>'+(p.powerUsed?' · power used':'')+'</span>').join('')+'</div><p>Only you see your role. Identities are revealed after the round; evidence stays with you.</p></section>';}
document.addEventListener('input',e=>{if(e.target.id==='chat-draft')chatDraft=e.target.value;if(e.target.id==='nickname')nick=e.target.value;if(e.target.id==='joincode')joinCode=e.target.value;});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();send();}});
document.addEventListener('keydown',e=>{if(e.target.id==='chat-draft'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}if(e.key==='Escape')$('#overlay').innerHTML='';if($('#overlay .modal')&&e.key==='Tab'){e.preventDefault();$('#overlay button').focus({preventScroll:true});$('#overlay .modal-content').scrollTop=0;}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.share!==undefined){chatDraft=state.cards[Number(b.dataset.share)].label+': '+state.cards[Number(b.dataset.share)].text;tab='chat';render();$('#chat-draft')?.focus();return;}if(b.dataset.action){const a=b.dataset.action;if(selected.includes(a))selected=selected.filter(x=>x!==a);else if(selected.length<state.budget)selected.push(a);else toast('All shared action points are allocated. Deselect an action first.');render();return;}const op=b.dataset.do;if(op==='rules')return rules();if(op==='deck')return showDeck();if(op==='close-rules'){$('#overlay').innerHTML='';return;}if(op==='copy'){const link=location.origin+'/?room='+session.code;try{await navigator.clipboard.writeText(link);toast('Invitation copied · Room code '+session.code);}catch{toast('Room code: '+session.code+'. Please share it manually.');}return;}if(op==='leave'){if(state?.phase!=='end'&&!confirm('Leaving clears your seat on this device. A live multiplayer game cannot replace you. Leave anyway?'))return;session=null;state=null;signature='';selected=[];chatDraft='';try{localStorage.removeItem('body-council-session');}catch{}window.history.replaceState(null,'','/');render();return;}if(op)action(op);});
render();let polling=false;async function poll(){if(!session||busy||polling)return;polling=true;try{accept(await request());}catch(e){toast(e.message);}finally{polling=false;}}if(session)poll();setInterval(poll,3500);
</script></body></html>
